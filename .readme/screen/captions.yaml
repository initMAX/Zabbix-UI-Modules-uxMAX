01-overview.png:
  cs: 'Latest data s tagy obarvenými podle pravidel: červené CPU, modrá paměť, fialový disk, oranžová služba HTTP.'
  en: 'Latest data with tags coloured by rule: red CPU, blue memory, purple disk, orange HTTP service.'
02-configuration.png:
  cs: Nastavte pravidla barevných tagů, kompaktní dashboardy, skryté hlavičky widgetů, přesouvání dialogů a další úpravy rozhraní na jednom místě.
  en: Configure color-tag rules, compact dashboards, hidden widget headers, draggable dialogs and other interface improvements in one place.
03-latest-data.png:
  cs: Zakázaná položka zůstává v seznamu šedá a označená D, aby nikdo nehledal data, která se nesbírají.
  en: A disabled item stays in the list, greyed out and marked D, so nobody hunts for data that is not being collected.
04-user-preferences.png:
  cs: 'My uxMAX: každý uživatel vidí globální pravidla barev a může si přidat vlastní, pokud to správce povolí.'
  en: 'My uxMAX: each user sees the global colour rules and can layer their own on top when the administrator allows it.'
uxMAX.png:
  cs: uxMAX spojuje několik praktických úprav uživatelského rozhraní do jednoho modulu Zabbixu.
  en: uxMAX combines multiple practical interface refinements into one Zabbix module.
widget.png:
  cs: Modul poskytuje centrální konfigurační stránku pro globální chování rozhraní.
  en: The module provides a centralized configuration page for global interface behavior.
